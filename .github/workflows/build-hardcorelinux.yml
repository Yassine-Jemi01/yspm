name: Build HardcoreLinux yspm package

on:
  push:
    branches:
      - artifact/hardcorelinux-yspm

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build yspm
        run: |
          set -eu
          rm -rf stage yspm.tar
          mkdir -p stage/usr/bin stage/etc/installer/yspm
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o stage/usr/bin/yspm ./cmd/yspm
          chmod 0755 stage/usr/bin/yspm
          printf '%s\n' '#!/bin/sh' 'exit 0' > stage/etc/installer/yspm/install
          chmod 0711 stage/etc/installer/yspm/install
          printf '%s\n' '#!/bin/sh' > stage/etc/installer/yspm/uninstall
          find stage -type f ! -path 'stage/etc/installer/yspm/uninstall' -printf 'rm /%P\n' >> stage/etc/installer/yspm/uninstall
          find stage -type l -printf 'rm /%P\n' >> stage/etc/installer/yspm/uninstall
          find stage -type d -printf 'rmdir /%P\n' >> stage/etc/installer/yspm/uninstall
          chmod 0711 stage/etc/installer/yspm/uninstall
          printf '%s\n' 'yspm 0.2.0 go1.27.1' > stage/etc/installer/yspm/pkinfo
          tar -cpzf yspm.tar -C stage .
          sha256sum yspm.tar
      - uses: actions/upload-artifact@v4
        with:
          name: hardcorelinux-yspm
          path: yspm.tar
