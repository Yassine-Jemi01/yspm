name: Go CI

on:
  push:
    branches: [main, system-package-manager]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/yspm
