name: Go CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.25.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check formatting for regression tests
        run: |
          files="cmd/yspm/main_test.go internal/config/config_test.go internal/manager/lock_test.go internal/manager/transaction_history_test.go internal/manager/background_args_test.go internal/manager/version_test.go internal/repo/index_cache_test.go internal/repo/release_test.go internal/repo/download_test.go"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go test files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector and coverage
        run: go test -race -cover ./...
      - name: Build
        run: go build ./cmd/yspm
